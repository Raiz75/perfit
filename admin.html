<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/icn-logo.png">
    <title>PERFIT</title>
    <style>
        :root {
            --a:rgb(128, 65, 128);
            --b: rgb(255, 223, 255);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-size: 1vw;
        }
        .title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--a);
            width: 100%;
            text-align: center;
            font-size: 3rem;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 450px;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid transparent;
            border: 1px solid var(--a);
        }
        .forms-wrapper {
            position: relative;
            width: 200%;
            display: flex;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
            background:
                linear-gradient(to bottom, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)),
                url("img/icn-logo.png");
            background-repeat: no-repeat;
            background-color: white;
            background-size: contain;
            background-position: center;
        }
        .form-section {
            width: 50%;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container.show-signup .forms-wrapper {transform: translateX(-50%);}
        h2 {
            color: var(--a);
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 700;
            width: 100%;
            text-align: center;
        }
        .input-group {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            display: flex;
        }
        .input-group img{
            height: 40px;
            width: 40px;
            margin: 5px;
            cursor:pointer;
        }
        input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--a);
            border-radius: 12px;
            font-size: 14px;
            font-family: "Poppins", sans-serif;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        input::placeholder {color: rgb(153, 133, 153);}
        button {
            width: 100px;
            height: 40px;
            border: 3px solid var(--a);
            border-radius: 12px;
            font-size: 1.2rem;
            background-color: var(--a);
            color: white;
            margin: auto;
            display: block;
            cursor: pointer;
            transition: .3s ease-in-out;
        }
        .toggle-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--a);
        }
        .toggle-link a {
            color: var(--a);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
        }
    /* alert */
        .message {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 300px;
            height: 60px;
            border: 3px solid transparent;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 1;
            color: transparent;
            transition: 0.5s ease-in-out;
            z-index: 5;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 3px solid #155724;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 3px solid #721c24;;
        }
    /* go home */
        .gotoHome{margin-bottom: 20px;}
    /* verify box */
        .verifyPopup{
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index:2;
            justify-content:center;
            align-items:center;
        }
        .verifyBox{
            background:white;
            padding:30px;
            border-radius:15px;
            text-align:center;
            width:320px;
            font-size: 1rem;
            box-shadow:0 10px 40px rgba(0,0,0,0.3);
            color:var(--a);
        }
        .verifyBox input{
            letter-spacing:5px;
            text-align:center;
            font-size:18px;
            border:2px solid var(--a);
            border-radius:8px;
            padding:10px;
            width:80%;
        }
        .btnBox{
            display: flex; 
            justify-content: center; 
            gap: 10px;
        }
    /* forgot password */
        .forgot-password {
            width: 100%;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            padding-top: 10px;
        }
        .forgot-password a {
            color: var(--a);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
        }
    /* forgot password box */
        .forgotPopup {
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index:2;
            justify-content:center;
            align-items:center;
        }
        .forgotBox{
            background:white;
            padding:30px;
            border-radius:15px;
            text-align:center;
            max-width:400px;
            margin:auto 10px;
            font-size: 1rem;
            box-shadow:0 10px 40px rgba(0,0,0,0.3);
            color:var(--a);
        }
        .forgotBox input{
            text-align:center;
            font-size:18px;
            border:2px solid var(--a);
            border-radius:8px;
            padding:10px;
            width:80%;
        }
        .btnBox{
            display: flex; 
            justify-content: center; 
            gap: 10px;
        }
    /* loading */
        .overlayLoad {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            z-index: 101;
        }
        .loaderContainer{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: auto; 
            text-align: center; 
        }
        .loader {
            border: 30px solid var(--b);
            border-top: 30px solid var(--a);
            border-radius: 50%;
            width: 150px;
            height: 150px;
            margin: auto;
            animation: spin 1s linear infinite;
        }
        .overlayLoad p{
            color: var(--b);
            width: 100%;
            font-size: 1.5em;
        }
        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (hover:hover){
             .forgot-password a:hover {
                text-decoration: underline;
                color: #7a007a;
            }
            button:hover{
                background-color: rgb(255, 223, 255);
                color: var(--a);
            }
            .toggle-link a:hover {text-decoration: underline;}
        }
        @media (max-width: 480px) {
            .loaderContainer{width: 300px;}
            .loader {
                border: 20px solid var(--b);
                border-top: 20px solid var(--a);
                width: 100px;
                height: 100px;
            }
            .overlayLoad p{font-size: 1.1rem;}
        }
        @media (max-width: 768px) {
            .form-section {padding: 40px 30px;}
            h2 {font-size: 24px;}
        }
    </style>
</head>
<body>
    <h1 class="title">Admin Login</h1>
    <div class="container" id="container">
        <div class="forms-wrapper">
            <!-- Sign In Form -->
            <div class="form-section">
                <h2>Welcome Back</h2>
                <form id="signinForm">
                    <div class="input-group">
                        <input type="email" name="email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password" id="signinPass" placeholder="Password" required>
                        <img src="img/icn-closedEyes.png" onclick="togglePassword('signinPass', this)">
                    </div>
                    <button type="submit">Sign In</button>
                </form>
                <div class="toggle-link">
                    Don't have an account? <a id="showSignup">Sign Up</a>
                </div>
                <!-- Forgot Password link -->
                <div class="forgot-password">
                    <a id="forgotPasswordLink">Forgot Password?</a>
                </div>
            </div>
            <!-- Sign Up Form -->
            <div class="form-section">
                <h2>Create Account</h2>
                <form id="signupForm">
                    <div class="input-group">
                        <input type="email" name="email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password" id="signupPass" placeholder="Password" required>
                        <img src="img/icn-closedEyes.png" onclick="togglePassword('signupPass', this)">
                    </div>
                    <div class="input-group">
                        <input type="password" id="confirmPass" placeholder="Confirm Password" required>
                        <img src="img/icn-closedEyes.png" onclick="togglePassword('confirmPass', this)">
                    </div>
                    <button type="submit">Sign Up</button>
                </form>
                <div class="toggle-link">
                    Already have an account? <a id="showSignin">Sign In</a>
                </div>
            </div>
        </div>
        <button class="gotoHome" onclick="gotoHome()">Go Home</button>
    </div>
    <div class="message" id="message"></div>
<!-- loading -->
    <div id="overlayLoad" class="overlayLoad">
        <div class="loaderContainer">
            <div class="loader"></div>
            <p>Loading, Please wait.</p>
        </div>
    </div>
    <!-- Verification Popup -->
    <div class="verifyPopup" id="verifyPopup" >
        <div class="verifyBox">
            <h3>Email Verification</h3>
            <p>Enter the 6-digit code sent to your email.</p>
            <input type="text" id="verifyCode" maxlength="6">
            <br><br>
            <div class="btnBox">
                <button onclick="cancelVerification()">Back</button>
                <button onclick="checkVerificationCode()">Verify</button>
            </div>
        </div>
    </div>
    <!-- Forgot Password Popup -->
    <div class="forgotPopup" id="forgotPopup">
        <div class="forgotBox">
            <h3>Reset Password</h3>
            <p>Enter your registered email to receive a temporary password.</p>
            <input type="email" id="resetEmail" placeholder="Enter your email" required>
            <br>
            <div class="btnBox">
                <button id="closeForgotPopup">Back</button>
                <button onclick="sendTemporaryPassword()">Send</button>
            </div>
        </div>
    </div>
    <script>
        function gotoHome(){
            document.getElementById('overlayLoad').style.display = "block";
            setTimeout(function() {
                document.getElementById('overlayLoad').style.display = "none";
                window.location.href = 'index.html';
            }, 2000);
        }
        const container = document.getElementById('container');
        const signinForm = document.getElementById('signinForm');
        const signupForm = document.getElementById('signupForm');
        const message = document.getElementById('message');
        const showSignup = document.getElementById('showSignup');
        const showSignin = document.getElementById('showSignin');
        // Toggle password visibility
        function togglePassword(id, icon) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                icon.src = "img/icn-openEyes.png";
            } else {
                input.type = "password";
                icon.src = "img/icn-closedEyes.png";
            }
        }
        // Toggle to signup
        showSignup.addEventListener('click', () => {
            container.classList.add('show-signup');
        });
        // Toggle to signin
        showSignin.addEventListener('click', () => {
            container.classList.remove('show-signup');
        });
    // Handles Sign Up
        signupForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const email = signupForm.querySelector('input[name="email"]').value.trim();
            const pass = document.getElementById("signupPass").value.trim();
            const confirm = document.getElementById("confirmPass").value.trim();
            // Step 1: Check if email already exists
            fetch("php-checkEmail.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            })
            .then(res => res.json())
            .then(emailData => {
                if (emailData.exists) {
                    // Email already registered
                    message.textContent = "Email already exists. Please use another one.";
                    message.className = "message error";
                    message.style.opacity = 1;
                    setTimeout(() => (message.style.opacity = 0), 3000);
                    return;
                }
                // Step 2: Check if passwords match
                if (pass !== confirm) {
                    message.textContent = "Passwords do not match!";
                    message.className = "message error";
                    message.style.opacity = 1;
                    setTimeout(() => (message.style.opacity = 0), 3000);
                    return;
                }
                message.textContent = "Processing verification code.";
                message.className = "message success";
                message.style.opacity = 1;
                setTimeout(() => {
                    message.style.opacity = 0;
                    // Step 3: Send verification code (only if email not existing and passwords match)
                    fetch("php-sendVerification.php", {
                        method: "POST",
                        body: JSON.stringify({ email }),
                        headers: { "Content-Type": "application/json" }
                    })
                    .then(res => res.json())
                    .then(mailData => {
                        if (mailData.success) {
                            // Store temporary signup data
                            window.tempSignupData = { email: email, password: pass };
                            window.generatedCode = mailData.code;

                            document.getElementById("verifyPopup").style.display = "flex";
                            message.textContent = "Verification code sent to your email.";
                            message.className = "message success";
                            message.style.opacity = 1;
                        } else {
                            message.textContent = mailData.message;
                            message.className = "message error";
                            message.style.opacity = 1;
                        }
                        setTimeout(() => (message.style.opacity = 0), 3000);
                    })
                    .catch(() => {
                        message.textContent = "Failed to send verification email.";
                        message.className = "message error";
                        message.style.opacity = 1;
                        setTimeout(() => (message.style.opacity = 0), 3000);
                    });
                }, 2000);
            })
            .catch(() => {
                message.textContent = "Error checking email.";
                message.className = "message error";
                message.style.opacity = 1;
                setTimeout(() => (message.style.opacity = 0), 3000);
            });
        });
    // Verify entered code
        function checkVerificationCode() {
            const inputCode = document.getElementById("verifyCode").value.trim();
            if (inputCode === window.generatedCode.toString()) {
                // ✅ Email verified successfully — now record account
                const formData = new FormData();
                formData.append("email", window.tempSignupData.email);
                formData.append("password", window.tempSignupData.password);
                fetch("php-signUp.php", {
                    method: "POST",
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        message.textContent = "Email verified and account created!";
                        message.className = "message success";
                        message.style.opacity = 1;
                        signupForm.reset();
                        document.getElementById("verifyPopup").style.display = "none";
                        showSignin.click();
                    } else {
                        message.textContent = data.message;
                        message.className = "message error";
                        message.style.opacity = 1;
                    }
                    setTimeout(() => (message.style.opacity = 0), 3000);
                })
                .catch(() => {
                    message.textContent = "Error saving account.";
                    message.className = "message error";
                    message.style.opacity = 1;
                    setTimeout(() => (message.style.opacity = 0), 3000);
                });
            } else {
                message.textContent = "Incorrect verification code!";
                message.className = "message error";
                message.style.opacity = 1;
                setTimeout(() => (message.style.opacity = 0), 2000);
            }
        }
        // Cancel verification popup
        function cancelVerification() {
            document.getElementById("verifyPopup").style.display = "none";
            message.textContent = "Verification cancelled.";
            message.className = "message error";
            message.style.opacity = 1;
            setTimeout(() => (message.style.opacity = 0), 2000);
        }
    // Handle Sign In>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
        signinForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const formData = new FormData(signinForm);
            fetch("php-signIn.php", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                message.textContent = data.message;
                message.style.opacity = 1;
                message.className = "message " + (data.success ? "success" : "error");
                if (data.success) {
                    setTimeout(() => {
                        message.style.opacity = 0;
                        document.getElementById('overlayLoad').style.display = "block";
                        setTimeout(function() {
                            document.getElementById('overlayLoad').style.display = "none";
                            window.location.href = 'adminPanel.html';
                        }, 2000);
                    }, 3000);
                }else{
                    setTimeout(() => {
                        message.style.opacity = 0;
                    }, 3000);
                }
            })
            .catch(() => {
                message.textContent = "Error connecting to server.";
                message.style.opacity = 1;
                message.className = "message error";
                setTimeout(() => {
                    message.style.opacity = 0;
                }, 3000);
            });
        });
    // open forgot password
        document.getElementById("forgotPasswordLink").addEventListener("click", () => {
            document.getElementById("forgotPopup").style.display = "flex";
        });
        // Close popup
        document.getElementById("closeForgotPopup").addEventListener("click", () => {
            document.getElementById("forgotPopup").style.display = "none";
            document.getElementById("resetEmail").value = ""; // clear input
        });
        // Send temporary password
        function sendTemporaryPassword() {
            const email = document.getElementById("resetEmail").value.trim();
            if (email === "") {
                message.textContent = "Please enter your email.";
                message.className = "message error";
                message.style.opacity = 1;
                setTimeout(() => (message.style.opacity = 0), 3000);
                return;
            }
            const formData = new FormData();
            formData.append("email", email);
            message.textContent = "Processing temporary password.";
            message.className = "message success";
            message.style.opacity = 1;
            setTimeout(() => {
                message.style.opacity = 0;
                fetch("php-forgotPass.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        message.textContent = "Temporary password sent to your email!";
                        message.className = "message success";
                        message.style.opacity = 1;
                        // Close popup after success
                        document.getElementById("forgotPopup").style.display = "none";
                        document.getElementById("resetEmail").value = "";
                    } else {
                        message.textContent = data.message;
                        message.className = "message error";
                        message.style.opacity = 1;
                    }
                    setTimeout(() => (message.style.opacity = 0), 3000);
                })
                .catch(() => {
                    message.textContent = "Error connecting to server.";
                    message.className = "message error";
                    message.style.opacity = 1;
                    setTimeout(() => (message.style.opacity = 0), 3000);
                });
            }, 2000);
        }
    </script>
</body>
</html>
